schema: zkge.claim/v1
id: CLAIM.TREEICON.010
statement: "「显示/隐藏文件树」按钮（FolderTree 图标）位于预览区操作组内，由 Tooltip 包裹、aria-pressed 指示状态；文件树行图标使用 workspace-tree__icon 类且 active 行有高亮"
owner: dev.desktop
risk_level: R1
required_assurance_level: A1
