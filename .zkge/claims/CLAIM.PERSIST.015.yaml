schema: zkge.claim/v1
id: CLAIM.PERSIST.015
statement: "右侧面板（dock）宽度和文件树宽度分别持久化：拖动 dock 分隔条记忆 rightDockTreeWidth；拖动文件树分隔条记忆 workspacePanel:treeWidth；重启/切换标签后恢复各自宽度"
owner: dev.desktop
risk_level: R2
