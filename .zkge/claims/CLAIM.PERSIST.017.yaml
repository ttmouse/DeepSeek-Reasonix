# CLAIM.PERSIST.017 — 最近打开文件列表记忆
schema: zkge.claim/v1
id: CLAIM.PERSIST.017
statement: "最近打开文件列表（recentPaths）独立于 live 预览标签持久化：workspacePanel:recentPaths 存最近 N 个打开的文件；关闭全部预览后最近文件菜单仍保留历史；重启后恢复"
owner: dev.desktop
risk_level: R2
required_assurance_level: A2
scope:
