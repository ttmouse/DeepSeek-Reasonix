counterexample:
  expression: "recentPaths 缺失或改用 openTabs（关闭预览后最近文件清空），或不持久化"
required_verifiers:
  - grep: WORKSPACE_RECENT_PATHS_KEY / recentPaths / recentFiles
invalidation_inputs: [specification_digest, source_digest]
status: UNKNOWN
